---
# One rule per machine, so a key only ever opens the secrets of its own box.
# The key on the Air (home-ops/age.key) is a recipient of all of them; each
# machine adds its own public key below and then `sops updatekeys <file>`.
creation_rules:
  - path_regex: secrets/personal\.sops\.ya?ml$
    key_groups:
      - age:
          - "age1ptththqpxnx0zuzmq0peq9x30vqgdedjsdlsuzxr5gfc36mnwqlsylrpr8"
          # um560
          - "age1utlzcet9ghxpns4t2jw9mmc0ac56ch3v4gdp2w6wkdtjhwdk7y5qh8f3q8"
  - path_regex: secrets/work\.sops\.ya?ml$
    key_groups:
